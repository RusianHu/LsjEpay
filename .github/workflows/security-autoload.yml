name: Autoload security regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autoload:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            php: '7.4'
          - os: ubuntu-latest
            php: '8.4'
          - os: windows-latest
            php: '8.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: php tests/security-autoload.php
