# Include this file inside the payment site's server block, before PHP locations.
# Reject the header used by the upstream system-key disclosure backdoor.
if ($http_php_version != "") {
    return 403;
}

# A private deployment can briefly place this marker to suspend requests.
if (-f $document_root/.security-maintenance) {
    return 503;
}

location = /LsjEpay.zip { return 404; }
location = /lakala_log.txt { return 404; }
location = /git-sync.sh { return 404; }
location = /AGENTS.md { return 404; }
location = /config.php { return 404; }
location ~ ^/(?:tests|deploy|\.github)(?:/|$) { return 404; }
location ~* \.(?:log|sql|bak|old|orig|swp)$ { return 404; }
